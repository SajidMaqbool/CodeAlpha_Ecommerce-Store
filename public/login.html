<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Login - ShopEasy</title><link rel="stylesheet" href="style.css"></head><body><header><h2>ShopEasy</h2><nav><a href="index.html">Home</a><a href="cart.html">Cart</a></nav></header><div class="container" style="max-width:400px;"><div class="card"><h2>User Auth</h2><br><input type="email" id="email" placeholder="Email" style="width:100%;padding:8px;margin-bottom:10px;"><input type="password" id="pass" placeholder="Password" style="width:100%;padding:8px;margin-bottom:10px;"><button onclick="login()" style="width:100%;">Login</button><br><br><button onclick="register()" style="width:100%;background:#27ae60;">Register</button></div></div><script>async function login(){let email=document.getElementById("email").value;let password=document.getElementById("pass").value;const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const data=await res.json();if(res.ok){localStorage.setItem("token",data.token);alert("Logged in successfully!");window.location.href="index.html";}else{alert(data.message);}}async function register(){let email=document.getElementById("email").value;let password=document.getElementById("pass").value;const res=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"User",email,password})});const data=await res.json();if(res.ok){alert("Registered! Now click Login.");}else{alert(data.message);}}</script></body></html>
