<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Shopping Cart</title><link rel="stylesheet" href="style.css"></head><body><header><h2>ShopEasy</h2><nav><a href="index.html">Home</a><a href="cart.html">Cart</a><a href="login.html">Login</a></nav></header><div class="container"><h1>Your Shopping Cart</h1><br><div id="cart-items"></div><br><h3>Total: $<span id="total-price">0</span></h3><br><button onclick="checkout()">Checkout</button></div><script>function loadCart(){let cart=JSON.parse(localStorage.getItem("cart"))||[];let div=document.getElementById("cart-items");let total=0;if(cart.length===0){div.innerHTML="<p>Cart is empty</p>";return;}div.innerHTML=cart.map(item=>{total+=item.price;return `<div class="card" style="margin-bottom:10px;text-align:left;"><h3>${item.title}</h3><p>Price: $${item.price}</p></div>`}).join("");document.getElementById("total-price").innerText=total;}async function checkout(){let token=localStorage.getItem("token");if(!token){alert("Please login first!");window.location.href="login.html";return;}let cart=JSON.parse(localStorage.getItem("cart"))||[];let items=cart.map(i=>({productId:i.id,quantity:1}));let totalAmount=cart.reduce((s,i)=>s+i.price,0);const res=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({items,totalAmount})});if(res.ok){alert("Order placed successfully!");localStorage.removeItem("cart");window.location.href="index.html";}else{alert("Failed to place order");}}loadCart();</script></body></html>
